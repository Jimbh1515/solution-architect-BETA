{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p>Use your approved Google account.</p>
  {% if configured %}
    <a class="btn primary" href="/login/google">Sign in with Google</a>
  {% else %}
    <p class="error">Google sign-in is not configured yet. Set <code>GOOGLE_CLIENT_ID</code> and <code>GOOGLE_CLIENT_SECRET</code> in the Render environment settings.</p>
  {% endif %}
</section>
{% endblock %}
