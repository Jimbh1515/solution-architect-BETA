services:
  - type: web
    name: solution-architect
    runtime: docker
    plan: free             # sleeps after 15 min idle (about 1 min to wake); upgrade to a paid instance in the Render dashboard if that bothers you
    region: singapore      # closest Render region to Malaysia; cannot be changed after creation
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # Render asks for the value when you create the service
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false        # comma-separated, e.g. you@gmail.com,colleague@gamuda.com.my
      - key: ALLOWED_DOMAINS
        sync: false        # optional, e.g. gamuda.com.my (lets everyone on that domain in)
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MAX_JOBS_PER_USER_PER_DAY
        value: "20"
