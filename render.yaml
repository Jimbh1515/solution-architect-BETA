services:
  - type: web
    name: solution-architect
    runtime: docker
    plan: free             # sleeps after 15 min idle (about 1 min to wake); upgrade to a paid instance in the Render dashboard if that bothers you
    region: singapore      # closest Render region to Malaysia; cannot be changed after creation
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # Render asks for the value when you create the service
      - key: AUTH_MODE
        value: none        # internal testing: no sign-in. Change to "github" and add GITHUB_CLIENT_ID,
                           # GITHUB_CLIENT_SECRET and ALLOWED_GITHUB_USERS to require GitHub sign-in.
      - key: MAX_JOBS_TOTAL_PER_DAY
        value: "30"        # cap across all visitors, protects your Gemini credit
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash   # used automatically when the main model stays overloaded
      - key: MAX_JOBS_PER_USER_PER_DAY
        value: "20"
